<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Successful | FashionShowcase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fce7f3;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      max-width: 450px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    }
    h1 {
      color: #db2777;
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    .btn {
      background: #db2777;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background: #b81c64;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎉 Order Placed Successfully!</h1>
    <p>Thank you for shopping with <b>FashionShowcase</b>.</p>
    <p>Your product will be delivered very soon.</p>
    <a href="index.html" class="btn">Back to Home</a>
  </div>
</body>
</html>
